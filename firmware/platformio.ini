[platformio]
src_dir = secureVOTE
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags =
    -Wall

[env:native]
platform = native
test_build_src = yes
build_src_filter = +<*.cpp> -<*.ino>
build_flags =
    -I secureVOTE
    -static
    -Wall
